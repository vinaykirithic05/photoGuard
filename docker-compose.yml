services:
  # 1. PhotoGuard FastAPI Backend & CNN Inference Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: photoguard_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./weights:/app/weights
      - ./checkpoints:/app/checkpoints
      - ./outputs:/app/outputs
    environment:
      - PYTHONUNBUFFERED=1

  # 2. PhotoGuard Flutter Web Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: photoguard_frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
